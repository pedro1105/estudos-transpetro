<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>O app de carreira mudou de endereço</title>
<style>body{margin:0;font:17px/1.5 system-ui,sans-serif;background:#F4F6F8;color:#1D2530;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}@media (prefers-color-scheme:dark){body{background:#14181E;color:#E4E8ED}}main{max-width:420px;display:flex;flex-direction:column;gap:14px}a{display:block;text-align:center;padding:12px 16px;border-radius:10px;font-weight:600;text-decoration:none;background:#2F5C9E;color:#fff}a.g{background:transparent;color:inherit;border:1.5px solid currentColor}</style></head>
<body><main><h1 style="font-size:22px;margin:0">O app Carreira em Dados mudou de endereço</h1><p>Ele agora tem o próprio app, separado do app da Transpetro.</p>
<a id="go" href="https://pedro1105.github.io/carreira-dados/">Abrir o app Carreira em Dados</a><a class="g" href="../">Voltar para o app da Transpetro</a></main>
<script>
/* tira o service worker antigo desta pasta */
if("serviceWorker" in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{if(/\/carreira\/$/.test(r.scope))r.unregister();})).catch(()=>{});
const nu="https://pedro1105.github.io/carreira-dados/"+location.hash; document.getElementById("go").href=nu;
/* no navegador, vai direto; dentro de um app instalado, deixa escolher */
if(!(matchMedia("(display-mode: standalone)").matches||navigator.standalone)) location.replace(nu);
</script></body></html>
