.task.done label{color:var(--muted);text-decoration:line-through}
.tchip{font:600 11px var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--amber-soft);color:var(--amber);white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}

.themebtn{all:unset;position:absolute;top:14px;right:max(16px,env(safe-area-inset-right,0px));cursor:pointer;font:600 12px var(--f-body);padding:6px 10px;border-radius:99px;border:1px solid currentColor;opacity:.9;z-index:2}

header.band .wrap{position:relative}

.streak{font:600 14px var(--f-body);padding:4px 10px;border-radius:99px;background:var(--amber-soft);color:var(--amber)}
.week7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font:500 11px var(--f-mono);color:var(--muted)}
.wbar{width:100%;max-width:34px;height:44px;border-radius:6px;background:var(--line);display:flex;align-items:flex-end;overflow:hidden}
.wbar i{display:block;width:100%;background:var(--petrol)}
details.rev summary .mark{color:var(--amber)}
/* conteúdos */
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:8px}
.topic{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.topic:hover{border-color:var(--petrol)}
.topic:focus-visible,.flash:focus-visible,.mitem:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.tname{font-weight:600;line-height:1.3}
.tmeta{display:flex;gap:6px;flex-wrap:wrap}
.pill{background:var(--line);color:var(--muted)}
.pill.mid{background:var(--amber-soft);color:var(--amber)}
ul.res{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ul.res li.trap{list-style:none;margin-left:-20px;padding:8px 10px;background:var(--amber-soft);border-radius:8px}
.readbox{cursor:pointer}
.readbox input{width:20px;height:20px;accent-color:var(--petrol);margin:0}
.btn.sm{padding:7px 12px;font-size:14px}
/* jogos */
.tbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--amber);transition:width .25s linear}
.flash{all:unset;cursor:pointer;box-sizing:border-box;display:grid;place-items:center;text-align:center;min-height:230px;padding:24px;border-radius:14px;border:2px solid var(--petrol);background:var(--surface);font:700 28px/1.2 var(--f-display);overflow-wrap:anywhere}
.flash.back{background:var(--petrol-soft);font:600 20px/1.45 var(--f-body)}
.vfcard{min-height:170px;display:flex;align-items:center;font-size:19px;line-height:1.5;border-width:2px}
.vfcard.ok{border-color:var(--ok);background:var(--ok-soft)}
.vfcard.bad{border-color:var(--bad);background:var(--bad-soft)}
.vfbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vfbtns .btn{padding:16px 10px;font-size:17px}
.btn.okb{background:var(--ok);color:#fff}
.btn.badb{background:var(--bad);color:#fff}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mitem{all:unset;cursor:pointer;box-sizing:border-box;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px;line-height:1.35;overflow-wrap:anywhere;min-height:48px;display:flex;align-items:center}
.mitem.term{font-weight:600}
.mitem.sel{border-color:var(--petrol);background:var(--petrol-soft)}
.mitem.done{border-color:var(--ok);background:var(--ok-soft);color:var(--muted);cursor:default}
.mitem.err{border-color:var(--bad);background:var(--bad-soft)}
@media (max-width:520px){.mitem{font-size:14px;padding:9px 10px}.flash{font-size:24px}}
@media (max-width:520px){.bar{grid-template-columns:minmax(0,1fr) 70px 46px}.qtext{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.chipbtn{all:unset;cursor:pointer;font:500 14px var(--f-body);padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface)}
.chipbtn.on{background:var(--petrol);color:var(--onpetrol);border-color:var(--petrol)}
.chipbtn:focus-visible,.bub:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.note{margin-top:4px;padding:12px;border:1px dashed var(--line);border-radius:10px}
.note textarea,#bkTxt{width:100%;box-sizing:border-box;font:15px var(--f-body);padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:inherit}
.task .btn{margin-left:auto;flex:none}
.task label{flex:1;min-width:0}
.days14{display:flex;gap:4px;flex-wrap:wrap}
.d14{width:26px;height:26px;border-radius:6px;background:var(--line);display:grid;place-items:center}
.d14 i{font:500 10px var(--f-mono);font-style:normal;color:var(--muted)}
.d14.na{opacity:.35}.d14.low{background:var(--amber-soft)}.d14.half{background:var(--amber)}.d14.half i,.d14.full i{color:#fff}.d14.full{background:var(--petrol)}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.phase.cur{border-color:var(--petrol);box-shadow:0 0 0 2px var(--petrol)}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
ul.links{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ul.links a{color:var(--petrol);text-underline-offset:3px;overflow-wrap:anywhere}
.segtabs{display:flex;gap:6px;flex-wrap:wrap}
.segtabs button{all:unset;cursor:pointer;padding:8px 12px;border-radius:8px;border:1px solid var(--line);font:600 14px var(--f-body)}
.segtabs button[aria-selected="true"]{background:var(--petrol);color:var(--onpetrol);border-color:var(--petrol)}
.qgrid{display:flex;flex-wrap:wrap;gap:6px}
.qnum.flag{background:var(--amber-soft);border-color:var(--amber)}
.rflag.on{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 18px}
.srow{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:6px}
.srow.diff{background:var(--bad-soft)}
.srow>span{width:24px;font-size:13px;color:var(--muted)}
.bub{all:unset;cursor:pointer;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font:600 12px var(--f-mono);color:var(--muted)}
.bub.on{background:var(--ink,#111);border-color:var(--ink,#111);color:var(--bg,#fff)}
.synclbl.ok{color:var(--ok)}.synclbl.bad{color:var(--bad)}
#toast{position:fixed;left:50%;bottom:16px;transform:translate(-50%,140%);width:min(440px,calc(100% - 32px));box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;z-index:50;transition:transform .25s}
#toast.on{transform:translate(-50%,0)}
#toast strong{width:100%}#toast span{width:100%}
nav.tabs{flex-wrap:wrap}

/* ===== v7: paleta confortável, fontes do sistema, layout por aparelho ===== */
:root{--bg:#F6F5F1;--surface:#FFFFFF;--ink:#24282E;--muted:#5D646D;--line:#E2E0D9;
 --petrol:#3D5A80;--petrol-soft:#E9EEF6;--amber:#8A5A00;--amber-soft:#FBF0DC;
 --ok:#2E7D50;--ok-soft:#E3F2E8;--bad:#B03A3A;--bad-soft:#F9E5E3;--onpetrol:#FFFFFF;
 --hdr:#FFFFFF;--hdr-ink:#24282E;
 --c-adm:#7A5CA8;--c-fin:#2E7D6B;--c-log:#A3561F;--c-info:#2F6FB0;--c-port:#A8456B;--c-mat:#5F7A2E;
 --f-display:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --f-mono:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#16181D;--surface:#1E2128;--ink:#E3E3DF;--muted:#A3A9B2;--line:#2E323A;
 --petrol:#8FB0DA;--petrol-soft:#243044;--amber:#E2B15C;--amber-soft:#2E2618;
 --ok:#72C994;--ok-soft:#1B2E22;--bad:#EE8A84;--bad-soft:#36201F;--onpetrol:#13161B;
 --hdr:#1E2128;--hdr-ink:#E3E3DF;
 --c-adm:#B9A0DE;--c-fin:#6CC4AE;--c-log:#E39A62;--c-info:#7FB0E6;--c-port:#E08AAB;--c-mat:#A8C46A}}
:root[data-theme="dark"]{
 --bg:#16181D;--surface:#1E2128;--ink:#E3E3DF;--muted:#A3A9B2;--line:#2E323A;
 --petrol:#8FB0DA;--petrol-soft:#243044;--amber:#E2B15C;--amber-soft:#2E2618;
 --ok:#72C994;--ok-soft:#1B2E22;--bad:#EE8A84;--bad-soft:#36201F;--onpetrol:#13161B;
 --hdr:#1E2128;--hdr-ink:#E3E3DF;
 --c-adm:#B9A0DE;--c-fin:#6CC4AE;--c-log:#E39A62;--c-info:#7FB0E6;--c-port:#E08AAB;--c-mat:#A8C46A}
body{font:17px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;padding-bottom:calc(80px + env(safe-area-inset-bottom,0px))}
h2{font:700 24px/1.2 var(--f-body);letter-spacing:-.01em}

.num{font-family:var(--f-body);font-variant-numeric:tabular-nums}

ul.res li{max-width:75ch}
.panel{border-radius:14px}
.opt{padding:13px 14px;min-height:48px;box-sizing:border-box}
.opt .l{font-family:var(--f-body)}

select,input[type=time]{min-height:46px;box-sizing:border-box}
.qnum{width:44px;height:44px;font:600 14px var(--f-body);border-radius:8px}
.bub{width:38px;height:38px;font-family:var(--f-body)}
.chipbtn{min-height:40px;display:inline-flex;align-items:center;box-sizing:border-box}
ul.links{gap:2px}ul.links a{display:inline-block;padding:9px 0}
.task{padding:10px 0;align-items:center}.task input{width:22px;height:22px;margin-top:0}

.wd,.pipe-lbl{font:500 12px var(--f-body)}

.bh{display:flex;align-items:center;gap:8px}.bh::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--bc,var(--petrol));flex:none}

/* cabeçalho */
header.band{background:var(--hdr);color:var(--hdr-ink);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header.band .hwrap{display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));max-width:1180px;margin:0 auto}

/* abas: barra inferior no celular */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--hdr);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));overflow:visible;flex-wrap:nowrap}

nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--petrol);background:var(--petrol-soft)}
nav.tabs button:focus-visible{outline:2px solid var(--petrol);outline-offset:-2px}
main .wrap{padding-block:18px 32px}
/* foco no simulado */
body.focus header.band,body.focus nav.tabs{display:none}
body.focus{padding-bottom:0}
.qexit{margin-right:auto}
.kbd{display:none}
#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
